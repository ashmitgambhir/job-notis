# Monitored employers. Add or remove entries here — no code changes needed.
#
# `verified: true` means the endpoint below was confirmed against the live API
# and returned real postings. `verified: false` means the connector/params are
# a starting point that still needs confirming; run:
#
#     jobmon discover --only <slug>     # probe and write back the right params
#     jobmon doctor                     # re-check everything and flip flags
#
# `connector: auto` asks the discovery engine to identify the platform at
# runtime and cache the result.

defaults:
  enabled: true
  priority: normal
  connector: auto
  verified: false

companies:
  # ---------------------------------------------------------------- verified
  - name: Anduril Industries
    slug: anduril
    priority: high
    connector: greenhouse
    params: { board_token: andurilindustries }
    careers_url: https://www.anduril.com/careers/
    verified: true
    tags: [defense, hardware, robotics]

  - name: SpaceX
    slug: spacex
    priority: high
    connector: greenhouse
    params: { board_token: spacex }
    careers_url: https://www.spacex.com/careers/
    verified: true
    tags: [aerospace, propulsion]

  - name: Rocket Lab
