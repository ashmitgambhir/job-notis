name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        # Unit tests are fully offline; every HTTP call is mocked with respx.
        run: pytest -q

      - name: Validate shipped configuration
        run: |
          python - <<'PY'
          from jobmonitor.config.loader import load_config
          from jobmonitor.connectors.registry import REGISTRY
          c = load_config()
          assert c.enabled_companies(), "no companies enabled"
          for company in c.companies.companies:
              assert company.connector == "auto" or company.connector in REGISTRY, company.slug
          print(f"OK: {len(c.companies.companies)} companies, "
                f"{sum(1 for x in c.companies.companies if x.verified)} verified")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jobmonitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm jobmonitor:ci jobmon --version
          docker run --rm jobmonitor:ci jobmon --help
