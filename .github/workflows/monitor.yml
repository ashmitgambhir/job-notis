# Serverless deployment: GitHub runs the scan on their cron instead of a host.
#
# Trade-off worth understanding before relying on this. GitHub's minimum cron
# interval is 5 minutes, and scheduled workflows are frequently delayed under
# load — 5 to 20 minutes late is normal and cannot be tuned away. Add ~2
# minutes of runner startup and install, and realistic end-to-end detection is
# 12-30 minutes, against 1-3 minutes for a persistent `jobmon run`.
#
# Two requirements that are easy to miss:
#
#   1. THE REPOSITORY SHOULD BE PUBLIC. Private repos get 2,000 free Actions
#      minutes per month; this schedule burns roughly 8,000. Public repos have
#      unlimited minutes. Secrets stay private either way — they live in
#      repository secrets, never in the checked-in files.
#   2. GITHUB DISABLES SCHEDULED WORKFLOWS AFTER 60 DAYS of repository
#      inactivity, silently. Push a commit occasionally, or re-enable it from
#      the Actions tab. Nothing can warn you, because nothing is running.
name: Monitor

on:
  schedule:
    # 5 minutes is GitHub's floor. Actual firing time drifts under load.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated company slugs (blank = all)"
        required: false
      no_notify:
        description: "Scan and score without sending anything"
        type: boolean
        default: false

concurrency:
  # Never let two scans overlap — they would race on the dedupe state.
  # Do not cancel a run in progress; it may be mid-way through claiming
  # notifications, and killing it strands them.
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The sentence-transformers model is ~90MB and would otherwise be
      # re-downloaded on every run. Without it the matcher falls back to
      # lexical similarity, which is measurably worse at catching relevant
      # roles whose titles contain none of the configured keywords.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[embeddings]"

      # The database carries the dedupe state. Without it every run would
      # re-notify the entire board — the single worst failure mode this
      # system has.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobmon-db-${{ github.run_id }}
          restore-keys: jobmon-db-

      - name: Scan
        env:
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_SMS_GATEWAY: ${{ secrets.ALERT_SMS_GATEWAY }}
          SMS_ENABLED: ${{ secrets.SMS_ENABLED }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
          SLACK_ENABLED: ${{ secrets.SLACK_ENABLED }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_ENABLED: ${{ secrets.LLM_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          LOG_FORMAT: json
          ONLY_INPUT: ${{ inputs.only }}
          NO_NOTIFY_INPUT: ${{ inputs.no_notify }}
        run: |
          ARGS=""
          if [ -n "$ONLY_INPUT" ]; then
            ARGS=$(printf '%s' "$ONLY_INPUT" | tr ',' '\n' | sed 's/^/--only /' | tr '\n' ' ')
          fi
          if [ "$NO_NOTIFY_INPUT" = "true" ]; then
            ARGS="$ARGS --no-notify"
          fi
          jobmon scan $ARGS

      - name: Save database
        # Always save. A partial scan still advanced the dedupe state, and
        # discarding it would re-notify everything on the next run.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: jobmon-db-${{ github.run_id }}

      - name: Summarise
        if: always()
        run: |
          echo "### Scan result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/jobmonitor.db ]; then
            python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sqlite3
          c = sqlite3.connect("data/jobmonitor.db")
          total = c.execute("select count(*) from jobs").fetchone()[0]
          matched = c.execute("select count(*) from jobs where matched=1").fetchone()[0]
          sent = c.execute(
              "select count(*) from notifications where status='sent'"
          ).fetchone()[0]
          print(f"- Postings tracked: **{total}**")
          print(f"- Matched: **{matched}**")
          print(f"- Notifications sent (all time): **{sent}**")
          PY
          else
            echo "- No database found (first run)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7
