# Local / single-host deployment. `docker compose up -d` and it runs.
services:
  jobmonitor:
    build:
      context: .
      args:
        # Set to "[embeddings]" for local semantic matching (adds ~2GB).
        EXTRAS: ""
    image: jobmonitor:latest
    container_name: jobmonitor
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_FORMAT: json
      HEALTH_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      # Config is bind-mounted so you can edit companies.yaml without rebuilding.
      - ./config:/app/config:ro
      - jobmonitor-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Uncomment to run against Postgres instead of SQLite, then set
  # DATABASE_URL=postgresql+psycopg://jobmon:jobmon@postgres:5432/jobmonitor
  #
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: jobmon
  #     POSTGRES_PASSWORD: jobmon
  #     POSTGRES_DB: jobmonitor
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  jobmonitor-data:
  # postgres-data:
